<div class="container">
  <h2 class="title">Users (Even IDs Only)</h2>

  <!-- USERS TABLE -->
  <table class="data-table">
    <thead>
      <tr>
        <th>User ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr 
        *ngFor="let u of users" 
        (click)="onUserSelect(u.id)"
        class="row-clickable"
      >
        <td>{{ u.id }}</td>
        <td>{{ u.name }}</td>
        <td>{{ u.email }}</td>
        <td>
          <button class="btn-view">View Posts</button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- POSTS TABLE -->
  <div *ngIf="userPosts" class="posts-section">
    <h3>Posts for User <span>{{ selectedUserId }}</span></h3>
    <table class="data-table">
      <thead>
        <tr>
          <th>Post ID</th>
          <th>Title</th>
          <th>Body</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let post of userPosts">
          <td>{{ post.id }}</td>
          <td>{{ post.title }}</td>
          <td>{{ post.body }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
